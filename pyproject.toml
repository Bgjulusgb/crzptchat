[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-chat"
version = "1.0.0"
description = "A secure, end-to-end encrypted messaging platform"
authors = [
    {name = "SecureChat Team", email = "team@securechat.example.com"},
]
dependencies = [
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "SQLAlchemy>=2.0.0",
    "Flask>=2.3.0",
    "Werkzeug>=2.3.0",
    "Flask-SQLAlchemy>=3.0.0",
    "Flask-JWT-Extended>=4.5.0",
    "Flask-Cors>=4.0.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
secure-chat-cli = "secure_chat_app:main"
secure-chat-web = "secure_chat.web.app:main"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "jwt.*",
    "bcrypt.*",
    "dotenv.*",
    "sqlalchemy.*",
    "flask.*",
    "werkzeug.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=secure_chat --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
    "secure_chat/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["secure_chat"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "secure_chat/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == \\.__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]